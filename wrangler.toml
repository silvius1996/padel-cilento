# =========================================================
# PADEL CILENTO — Configurazione deploy su Cloudflare Workers
# Deploy:  npx wrangler deploy
# =========================================================

# Deve restare "padelcilento": e' il nome che determina l'URL
# https://padelcilento.silvius13-bet.workers.dev
name = "padelcilento"
compatibility_date = "2026-07-25"

[assets]
# Viene pubblicato SOLO il contenuto di public/.
# Gli schema .sql restano fuori dal deploy, nella cartella del progetto.
directory = "./public"

# App a pagina singola: qualunque indirizzo serve index.html
# invece di restituire un 404.
not_found_handling = "single-page-application"
