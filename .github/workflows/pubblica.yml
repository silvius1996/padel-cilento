# =========================================================
# PADEL CILENTO — Pubblicazione automatica
#
# Quando qualcosa arriva nel ramo principale, GitHub fa da solo cio'
# che prima si faceva a mano dal computer:
#
#   1. esegue i test        (se falliscono, si ferma qui)
#   2. aggiorna il database (le migrazioni mancanti)
#   3. pubblica il sito
#
# L'ordine non e' un dettaglio: il database va aggiornato PRIMA del
# sito, altrimenti per qualche minuto la pagina nuova cerca funzioni
# che nel database non esistono ancora. I tre passi sono legati fra
# loro con "needs", quindi quell'ordine e' garantito.
#
# SERVONO TRE SEGRETI, da impostare una volta sola in
# Settings -> Secrets and variables -> Actions:
#
#   SUPABASE_DB_URL         la stringa di connessione al database
#                           (la stessa che sta nel file .env)
#   CLOUDFLARE_API_TOKEN    token con permesso "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID   l'identificativo dell'account Cloudflare
#
# Finche' non ci sono, il passo corrispondente si ferma spiegando
# quale manca.
# =========================================================

name: Pubblica

on:
  push:
    branches: [master]
  # Permette di rilanciare la pubblicazione a mano dalla scheda
  # "Actions", senza dover modificare niente.
  workflow_dispatch:

# Due pubblicazioni contemporanee si darebbero fastidio: la seconda
# aspetta che la prima abbia finito.
concurrency:
  group: pubblicazione
  cancel-in-progress: false

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Non e' un capriccio: wrangler, lo strumento che pubblica su
          # Cloudflare, si rifiuta di partire con meno della 22.
          node-version: 22
      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm test

  database:
    name: 2. Database
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Non e' un capriccio: wrangler, lo strumento che pubblica su
          # Cloudflare, si rifiuta di partire con meno della 22.
          node-version: 22

      - name: Controllo del segreto
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Manca il segreto SUPABASE_DB_URL."
            echo "Impostalo in Settings -> Secrets and variables -> Actions."
            echo "E' la stessa stringa che sta nel file .env sul computer."
            exit 1
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Applica le migrazioni mancanti
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:push

      - name: Stato delle migrazioni
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:status

  sito:
    name: 3. Sito
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Non e' un capriccio: wrangler, lo strumento che pubblica su
          # Cloudflare, si rifiuta di partire con meno della 22.
          node-version: 22

      - name: Controllo dei segreti
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Si crea dal pannello Cloudflare, sezione token API,"
            echo "con il modello \"Edit Cloudflare Workers\"."
            exit 1
          fi
          # L'identificativo dell'account e' facoltativo: se la chiave ha
          # accesso a un solo account, Cloudflare lo ricava da sola. Serve
          # indicarlo solo quando gli account sono piu' di uno, perche' li'
          # la pubblicazione non saprebbe su quale andare.
          if [ -z "$ACCOUNT" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID non impostato: si lascia decidere alla chiave."
            echo "Se la pubblicazione qui sotto dice di non sapere quale account usare,"
            echo "aggiungi il segreto: e' la sequenza di lettere e numeri che compare"
            echo "nell'indirizzo del pannello Cloudflare, subito dopo dash.cloudflare.com/"
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Rigenera il foglio di stile e pubblica: e' esattamente il
      # comando "npm run deploy" che si usava dal computer.
      - name: Pubblica il sito
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
