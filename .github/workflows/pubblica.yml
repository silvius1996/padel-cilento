# =========================================================
# PADEL CILENTO — Pubblicazione automatica
#
# Quando qualcosa arriva nel ramo principale, GitHub fa da solo cio'
# che prima si faceva a mano dal computer:
#
#   1. esegue i test        (se falliscono, si ferma qui)
#   2. aggiorna il database (le migrazioni mancanti)
#   3. pubblica il sito
#
# L'ordine non e' un dettaglio: il database va aggiornato PRIMA del
# sito, altrimenti per qualche minuto la pagina nuova cerca funzioni
# che nel database non esistono ancora. I tre passi sono legati fra
# loro con "needs", quindi quell'ordine e' garantito.
#
# SERVONO TRE SEGRETI, da impostare una volta sola in
# Settings -> Secrets and variables -> Actions:
#
#   SUPABASE_DB_URL     la stringa di connessione al database
#                       (la stessa che sta nel file .env)
#   VERCEL_TOKEN        token personale creato su vercel.com/account/tokens
#   VERCEL_ORG_ID       identificativo dell'account Vercel
#   VERCEL_PROJECT_ID   identificativo del progetto Vercel
#
# Finche' non ci sono, il passo corrispondente si ferma spiegando
# quale manca.
#
# Perche' il deploy lo fa GitHub e non Vercel da solo: Vercel, collegato
# al repository, pubblicherebbe a ogni push senza aspettare le migrazioni,
# e per qualche minuto il sito nuovo cercherebbe funzioni che nel database
# non esistono ancora. Per questo in vercel.json la pubblicazione
# automatica sul ramo principale e' disattivata: l'unica strada e' questa.
# =========================================================

name: Pubblica

on:
  push:
    branches: [master]
  # Permette di rilanciare la pubblicazione a mano dalla scheda
  # "Actions", senza dover modificare niente.
  workflow_dispatch:

# Due pubblicazioni contemporanee si darebbero fastidio: la seconda
# aspetta che la prima abbia finito.
concurrency:
  group: pubblicazione
  cancel-in-progress: false

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Il browser non lo scarica l'installazione delle dipendenze —
      # servirebbero tutti quelli che Playwright supporta — ma il passo
      # dopo, e solo Chromium: e' quello che apre test/app.test.mjs per
      # usare l'app come la userebbe una persona.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx playwright install --with-deps chromium
      - run: npm test

  database:
    name: 2. Database
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Controllo del segreto
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Manca il segreto SUPABASE_DB_URL."
            echo "Impostalo in Settings -> Secrets and variables -> Actions."
            echo "E' la stessa stringa che sta nel file .env sul computer."
            exit 1
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Applica le migrazioni mancanti
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:push

      - name: Stato delle migrazioni
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:status

  sito:
    name: 3. Sito
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Controllo dei segreti
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROGETTO: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Manca il segreto VERCEL_TOKEN."
            echo "Si crea su https://vercel.com/account/tokens."
            exit 1
          fi
          if [ -z "$ORG" ] || [ -z "$PROGETTO" ]; then
            echo "Mancano VERCEL_ORG_ID o VERCEL_PROJECT_ID."
            echo "Si leggono dal file .vercel/project.json che compare sul"
            echo "computer dopo aver lanciato una volta:  npx vercel link"
            exit 1
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # LA BUILD LA FA VERCEL, NON QUESTO RUNNER
      #
      # Prima si compilava qui e si caricava il risultato pronto con
      # "vercel build" + "deploy --prebuilt". Funzionava, ma un
      # deployment prebuilt non passa dalla build della piattaforma, e
      # con essa si perdono le rotte che Vercel aggiunge da se':
      # /_vercel/insights/script.js e /_vercel/insights/view, cioe' il
      # conteggio delle visite. Rispondevano 404 e Analytics restava a
      # zero. Un deployment prebuilt, per lo stesso motivo, non si puo'
      # nemmeno rifare dal pannello: non ha sorgenti da ricostruire.
      #
      # Ora si carica il codice e la compilazione avviene la', con
      # l'installCommand e il buildCommand scritti in vercel.json.
      #
      # La garanzia che si voleva col prebuilt resta: "build:css" gira
      # anche qui, un passo prima. Se il foglio di stile non compila il
      # workflow si ferma e in produzione non arriva niente.
      - name: Controlla che gli stili compilino
        run: npm run build:css

      - name: Pubblica il sito
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # I due identificativi vanno passati con questi nomi esatti:
          # sono quelli che la CLI cerca da sola.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$TOKEN"
          npx vercel deploy --prod --token="$TOKEN"

      # Se il conteggio delle visite torna a mancare, meglio saperlo qui
      # che scoprirlo fra un mese guardando un grafico vuoto. E' un
      # avviso e non un errore: il sito a quel punto e' gia' online e
      # funzionante, e far diventare rosso il workflow per un contatore
      # spento vorrebbe dire non fidarsi piu' del segnale rosso.
      - name: Il conteggio delle visite risponde
        run: |
          stato=$(curl -s -o /dev/null -w "%{http_code}" \
            https://padel-cilento.vercel.app/_vercel/insights/script.js)
          echo "/_vercel/insights/script.js -> $stato"
          if [ "$stato" != "200" ]; then
            echo "::warning::Sito pubblicato, ma Vercel non serve lo script delle visite (HTTP $stato). Controlla che Web Analytics sia acceso nel pannello del progetto."
          fi
