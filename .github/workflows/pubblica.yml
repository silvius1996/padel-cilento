# =========================================================
# PADEL CILENTO — Pubblicazione automatica
#
# Quando qualcosa arriva nel ramo principale, GitHub fa da solo cio'
# che prima si faceva a mano dal computer:
#
#   1. esegue i test        (se falliscono, si ferma qui)
#   2. aggiorna il database (le migrazioni mancanti)
#   3. pubblica il sito
#
# L'ordine non e' un dettaglio: il database va aggiornato PRIMA del
# sito, altrimenti per qualche minuto la pagina nuova cerca funzioni
# che nel database non esistono ancora. I tre passi sono legati fra
# loro con "needs", quindi quell'ordine e' garantito.
#
# SERVONO TRE SEGRETI, da impostare una volta sola in
# Settings -> Secrets and variables -> Actions:
#
#   SUPABASE_DB_URL     la stringa di connessione al database
#                       (la stessa che sta nel file .env)
#   VERCEL_TOKEN        token personale creato su vercel.com/account/tokens
#   VERCEL_ORG_ID       identificativo dell'account Vercel
#   VERCEL_PROJECT_ID   identificativo del progetto Vercel
#
# Finche' non ci sono, il passo corrispondente si ferma spiegando
# quale manca.
#
# Perche' il deploy lo fa GitHub e non Vercel da solo: Vercel, collegato
# al repository, pubblicherebbe a ogni push senza aspettare le migrazioni,
# e per qualche minuto il sito nuovo cercherebbe funzioni che nel database
# non esistono ancora. Per questo in vercel.json la pubblicazione
# automatica sul ramo principale e' disattivata: l'unica strada e' questa.
# =========================================================

name: Pubblica

on:
  push:
    branches: [master]
  # Permette di rilanciare la pubblicazione a mano dalla scheda
  # "Actions", senza dover modificare niente.
  workflow_dispatch:

# Due pubblicazioni contemporanee si darebbero fastidio: la seconda
# aspetta che la prima abbia finito.
concurrency:
  group: pubblicazione
  cancel-in-progress: false

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm test

  database:
    name: 2. Database
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Controllo del segreto
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Manca il segreto SUPABASE_DB_URL."
            echo "Impostalo in Settings -> Secrets and variables -> Actions."
            echo "E' la stessa stringa che sta nel file .env sul computer."
            exit 1
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Applica le migrazioni mancanti
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:push

      - name: Stato delle migrazioni
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:status

  sito:
    name: 3. Sito
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Controllo dei segreti
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROGETTO: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Manca il segreto VERCEL_TOKEN."
            echo "Si crea su https://vercel.com/account/tokens."
            exit 1
          fi
          if [ -z "$ORG" ] || [ -z "$PROGETTO" ]; then
            echo "Mancano VERCEL_ORG_ID o VERCEL_PROJECT_ID."
            echo "Si leggono dal file .vercel/project.json che compare sul"
            echo "computer dopo aver lanciato una volta:  npx vercel link"
            exit 1
          fi

      # Playwright sta fra le dipendenze perche' scripts/marchio.mjs e
      # scripts/spot.mjs lo usano, ma qui non si apre nessun browser:
      # senza questa variabile ogni installazione scaricherebbe
      # centinaia di megabyte per non usarli.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Tre comandi invece di uno perche' la compilazione avviene qui,
      # non sui server di Vercel: si carica il risultato gia' pronto
      # ("--prebuilt"). Cosi' se il foglio di stile non compila, il
      # workflow si ferma e in produzione non arriva niente.
      #
      #   pull    scarica le impostazioni del progetto (senza questo,
      #           "build" non saprebbe che si sta preparando la produzione)
      #   build   rigenera public/styles.css e prepara .vercel/output
      #   deploy  carica e mette online
      - name: Pubblica il sito
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # I due identificativi vanno passati con questi nomi esatti:
          # sono quelli che la CLI cerca da sola.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$TOKEN"
          npx vercel build --prod --token="$TOKEN"
          npx vercel deploy --prebuilt --prod --token="$TOKEN"
