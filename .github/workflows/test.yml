# =========================================================
# PADEL CILENTO — Test automatici
#
# Girano sui rami di lavoro: servono ad accorgersi di un errore
# PRIMA che il lavoro arrivi nel ramo principale.
#
# Sul ramo principale i test li esegue "pubblica.yml" come primo
# passo, quindi qui il ramo principale e' escluso per non farli
# girare due volte.
# =========================================================

name: Test

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Il browser non lo scarica l'installazione delle dipendenze —
      # servirebbero tutti quelli che Playwright supporta — ma il passo
      # dopo, e solo Chromium: e' quello che apre test/app.test.mjs per
      # usare l'app come la userebbe una persona.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npx playwright install --with-deps chromium

      - run: npm test
